name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis-and-package:
    name: Analysis and package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the selected Python version
        run: uv python install

      - name: Install the locked analysis environment
        run: |
          uv sync --locked --group analysis
          uv pip check

      - name: Run tests
        run: uv run --locked --group analysis python -m unittest discover -s tests -v

      - name: Check analysis commands
        run: |
          uv run --locked --group analysis es-capacity-ethics --help
          uv run --locked --group analysis es-capacity-models --help
          uv run --locked --group analysis es-capacity-passk --help
          for script in scripts/passk/analyze.py scripts/mmlu/tables.py scripts/gpqa/analyze.py scripts/gpqa/tables.py scripts/weights/plot.py; do
            uv run --locked --group analysis python "$script" --help
          done

      - name: Build and test the installed distribution
        run: uv run --locked --group analysis python scripts/check_package.py

  required-checks:
    name: CI
    if: ${{ always() }}
    needs: analysis-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every Python job to succeed
        env:
          ANALYSIS_CHECKS_RESULT: ${{ needs.analysis-and-package.result }}
        run: test "$ANALYSIS_CHECKS_RESULT" = success
